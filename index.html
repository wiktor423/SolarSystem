<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>N-Body Gravity Engine — JS vs WASM</title>
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/",
        "three/src/": "../node_modules/three/src/",
        "chart.js/auto": "../node_modules/chart.js/auto/auto.js",
        "@kurkle/color": "../node_modules/@kurkle/color/dist/color.esm.js"
      }
    }
  </script>

  <style>
    html, body {
      margin: 0; 
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background-color: #050505; 
    }
    #c {
      width: 100%;
      height: 100%;
      display: block;
    }

    #welcome-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000; 
      transition: opacity 0.5s ease; 
    }

    .welcome-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 600px;
    }

    .start-btn {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 1.1em;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.4s;
    }
    .start-btn:hover { background: #45a049; }

    #sim-ui {
      position: absolute; 
      top: 10px; left: 10px; 
      background: rgba(10, 10, 20, 0.88);
      color: #e0e0e0;
      padding: 15px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      z-index: 100;
      display: none;
      min-width: 220px;
    }

    #sim-ui h3 {
      color: #fff;
      letter-spacing: 0.04em;
      font-size: 0.95em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 12px;
    }

    #sim-ui label {
      font-size: 0.85em;
      opacity: 0.65;
    }

    #sim-ui select,
    #sim-ui input[type=number] {
      background: rgba(255,255,255,0.07);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      padding: 4px 6px;
    }

    #sim-ui select option {
      background: #12121f;
      color: #e0e0e0;
    }

    .sim-btn {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer;
      font-size: 0.88em;
      font-family: sans-serif;
      transition: background 0.2s, border-color 0.2s;
      background: rgba(255,255,255,0.08);
      color: #e0e0e0;
    }
    .sim-btn:hover {
      background: rgba(255,255,255,0.16);
      border-color: rgba(255,255,255,0.3);
    }
    .sim-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #start-benchmark-btn,
    #export-csv-btn {
      background: rgba(76, 175, 80, 0.18);
      border-color: rgba(76, 175, 80, 0.5);
      color: #a5d6a7;
    }
    #start-benchmark-btn:hover:not(:disabled),
    #export-csv-btn:hover:not(:disabled) {
      background: rgba(76, 175, 80, 0.32);
      border-color: rgba(76, 175, 80, 0.8);
    }
    #start-benchmark-btn:disabled,
    #export-csv-btn:disabled {
      opacity: 0.35;
    }

  </style>

</head>

<body>
    <div id="welcome-screen">
        <div class="welcome-card">
            <h1 style="margin-top: 0;">N-Body Gravity Engine</h1>
            <p style="line-height: 1.6; color: #ccc;">
                A high-performance computational physics benchmark comparing the execution limits of JavaScript (V8) against WebAssembly (C++).
            </p>
            
            <div style="margin: 30px 0; text-align: left; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 6px;">
                <label><strong>Select Initial Engine:</strong></label><br><br>
                <select id="initial-engine" style="width: 100%; padding: 8px;">
                    <option value="WASM">C++ WebAssembly (Max Performance)</option>
                    <option value="JS">JavaScript (Standard)</option>
                </select>
                <br><br>
                <label><strong>Target Bodies:</strong></label><br><br>
                <input type="number" id="initial-asteroids" value="1400" step="100" style="width: 100%; padding: 8px;">
            </div>

            <button id="enter-sim-btn" class="start-btn">Launch Simulation</button>
        </div>
    </div>

    <div id="sim-ui">
        <h3 style="margin-top: 0;">Live Telemetry</h3>
        <label>Engine:</label>
        <select id="engine-select">
            <option value="WASM">C++ WebAssembly</option>
            <option value="JS">JavaScript (V8)</option>
        </select>
        <br><br>
        <label>Asteroids:</label>
        <input type="number" id="asteroid-input" value="1400" step="100" style="width: 70px;">
        <br><br>
        <button id="restart-btn" class="sim-btn">Restart Environment</button>
        <br>
        <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px;">
          <button id="export-csv-btn" class="sim-btn" disabled>Export CSV</button>
          <span id="benchmark-progress" style="font-family: monospace; font-size: 0.82em; color: #81c784; opacity: 0.9;">0 / 1000</span>
        </div>

        <div style="margin-top: 15px; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 5px;">
            <div style="margin-bottom: 5px; font-family: monospace; font-size: 0.9em; opacity: 0.7;">
                Physics Time: <span id="physics-time-display">0.00</span> ms
            </div>
            <div style="font-family: monospace; font-size: 0.9em; opacity: 0.7;">
                Physics FPS: <span id="physics-fps-display">0</span>
            </div>
            <div style="margin-top: 10px; height: 80px; width: 200px; opacity: 0.5;">
                <canvas id="performance-chart"></canvas>
            </div>
        </div>
    </div>

    <canvas id="c"></canvas>
    <script type="module" src="src/main.js"></script>
</body>
</html>
