<!DOCTYPE html>
<html>
<head>
	<script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/"
      }
    }
  </script>

	<style>
		html, body {
			margin: 0; 
			height: 100%;
			overflow: hidden;
		}
		#c {
			width: 100%;
			height: 100%;
			display: block;
		}
	</style>
</head>

<body>
    <div style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: white; padding: 15px; font-family: sans-serif; border-radius: 8px; z-index: 100;">
        <h3 style="margin-top: 0;">Computational Load</h3>
        
        <label>Engine:</label>
        <select id="engine-select">
            <option value="WASM">C++ WebAssembly</option>
            <option value="JS">JavaScript (V8)</option>
        </select>
        <br><br>

        <label>Asteroids:</label>
        <input type="number" id="asteroid-input" value="1400" step="100" style="width: 70px;">
        <br><br>

        <button id="restart-btn" style="padding: 5px 10px; cursor: pointer;">Start / Reset</button>
    </div>

    <script type="module" src="src/main.js"></script>
    <canvas id="c"></canvas>
</body>
</html>
